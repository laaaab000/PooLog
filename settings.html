
<!DOCTYPE html>

<head>

    <title>PooLog｜提醒與設定</title>
    <link rel="stylesheet" href="style.css">

    <style>
        .settings-section {
            padding: 40px 0 60px;
        }

        .settings-header {
            margin-bottom: 30px;
        }

        .settings-header h1 {
            color: var(--text);
            font-size: 30px;
            margin-bottom: 10px;
        }

        .settings-header p {
            color: var(--text-light);
        }

        .settings-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 25px;
            margin-bottom: 20px;
        }

        .settings-card h2 {
            color: var(--text);
            font-size: 20px;
            margin-bottom: 12px;
        }

        .settings-card p {
            color: var(--text-light);
            line-height: 1.8;
        }

        .settings-status {
            padding: 14px;
            background: var(--accent);
            border-radius: 8px;
            color: var(--text-light);
            text-align: center;
        }
    </style>
</head>

<main class="section page-content settings-section">

        </div>

        <section class="settings-card">
            <h2>排便提醒</h2>
            <p>透過規律提醒，幫助自己養成良好的排便習慣。</p>

            <div class="settings-status">
                飲水提醒功能即將推出！
            </div>
        </section>

        <section class="settings-card">
            <h2>個人設定</h2>
            <p>未來將提供個人化設定與提醒管理功能。</p>
            <div class="settings-status">
                個人設定功能即將推出！
            </div>
        </section>

    </div>
</main>

<footer class="footer">

        <p>PooLog.</p>

    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
